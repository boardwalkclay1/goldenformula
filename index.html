<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Golden Formula – Advanced Setup Engine</title>
<style>
  body { font-family: Arial, sans-serif; background:#050509; color:#f5f5f5; padding:20px; max-width:1100px; margin:0 auto; }
  h1 { color:#ff2b6a; }
  h2 { color:#ff9ac0; margin-top:25px; }
  label { display:block; margin-top:8px; font-size:13px; }
  input, select, textarea { padding:7px; margin-top:3px; width:100%; border-radius:4px; border:1px solid #333; background:#15151b; color:#f5f5f5; }
  textarea { min-height:70px; font-family:monospace; }
  button { padding:10px; background:#ff2b6a; color:white; border:none; width:100%; margin-top:15px; border-radius:4px; font-weight:bold; cursor:pointer; }
  button:hover { background:#ff4c84; }
  .section-box { border:1px solid #333; border-radius:6px; padding:12px; margin-top:12px; background:#0b0b12; }
  .note { font-size:11px; color:#b0b0c0; margin-top:3px; }
  .result { margin-top:20px; padding:15px; border-radius:8px; }
  .strong { background:#123822; border:1px solid #1f8b4c; }
  .decent { background:#3a3218; border:1px solid #8b6b1f; }
  .weak { background:#3a1823; border:1px solid #8b1f3a; }
  canvas { background:#0f0f16; border:1px solid #333; border-radius:6px; margin-top:15px; width:100%; max-width:1050px; }
  .pill { display:inline-block; padding:3px 8px; border-radius:999px; font-size:11px; margin-right:4px; margin-top:4px; }
  .pill-bull { background:#123822; border:1px solid #1f8b4c; }
  .pill-bear { background:#3a1823; border:1px solid #8b1f3a; }
  .pill-neutral { background:#222233; border:1px solid #555577; }
</style>
</head>
<body>

<h1>Golden Formula – Advanced Setup Engine</h1>
<p class="note">
  This page scores the setup, determines bull/put bias, calculates entry & stop, estimates R:R, and exports everything to the options page.
</p>

<div class="section-box">
  <h2>1. Market Context & Price Structure</h2>

  <label>Timeframe
    <span class="note">Higher timeframes = stronger signals, slower moves.</span>
  </label>
  <select id="timeframe">
    <option value="5m">5m (scalps)</option>
    <option value="15m">15m</option>
    <option value="1h">1h</option>
    <option value="4h">4h</option>
    <option value="daily">Daily swing</option>
  </select>

  <label>Current Price
    <span class="note">Last traded price of the underlying.</span>
  </label>
  <input id="price" type="number" step="0.01">

  <label>20 EMA
    <span class="note">Short‑term trend / momentum.</span>
  </label>
  <input id="ma20" type="number" step="0.01">

  <label>50 EMA
    <span class="note">Intermediate trend.</span>
  </label>
  <input id="ma50" type="number" step="0.01">

  <label>200 EMA
    <span class="note">Macro trend / bias.</span>
  </label>
  <input id="ma200" type="number" step="0.01">

  <label>Key Support
    <span class="note">Major demand level below price (for longs) or already broken (for shorts).</span>
  </label>
  <input id="support" type="number" step="0.01">

  <label>Key Resistance
    <span class="note">Major supply level above price (for shorts) or already broken (for longs).</span>
  </label>
  <input id="resistance" type="number" step="0.01">
</div>

<div class="section-box">
  <h2>2. Pattern Evidence (User‑Confirmed)</h2>

  <label>Primary Pattern
    <span class="note">You confirm what you actually see on the chart.</span>
  </label>
  <select id="pattern">
    <option value="none">None / unclear</option>
    <option value="roundingBottom">Rounding Bottom</option>
    <option value="roundingTop">Rounding Top</option>
    <option value="doubleBottom">Double Bottom</option>
    <option value="doubleTop">Double Top</option>
    <option value="bullFlag">Bull Flag</option>
    <option value="bearFlag">Bear Flag</option>
  </select>

  <label>Is price reacting at an even level? (e.g. 100, 150, 200)
    <span class="note">Psychological levels often act as magnets and turning points.</span>
  </label>
  <select id="even">
    <option value="no">No / not important</option>
    <option value="yes">Yes, clear reaction</option>
  </select>

  <label>Swing Low (for longs)
    <span class="note">Last obvious higher low you’d hide a stop under.</span>
  </label>
  <input id="swingLow" type="number" step="0.01">

  <label>Swing High (for shorts)
    <span class="note">Last obvious lower high you’d hide a stop above.</span>
  </label>
  <input id="swingHigh" type="number" step="0.01">
</div>

<div class="section-box">
  <h2>3. Optional – Manual Candles (Custom History)</h2>
  <label>Candles (open,high,low,close per line)
    <span class="note">If left empty, the engine auto‑simulates a plausible history based on your bias.</span>
  </label>
  <textarea id="manualCandles" placeholder="e.g. 99.5,100.2,99.1,100.0"></textarea>
</div>

<button onclick="runFormula()">Run Golden Formula</button>

<div id="output"></div>
<canvas id="chart" width="1050" height="320"></canvas>

<button onclick="goToOptions()">Go to Options Selector →</button>

<script>
// ---------- CORE HELPERS ----------
function nearEven(price) {
  const levels = [5,10,25,50,100];
  for (let base of levels) {
    let lvl = Math.round(price / base) * base;
    if (Math.abs(price - lvl) <= price * 0.0025) return true; // ~0.25% band
  }
  return false;
}

function parseManualCandles(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const candles = [];
  for (let line of lines) {
    const p = line.split(',').map(x => parseFloat(x.trim()));
    if (p.length === 4 && p.every(v => !isNaN(v))) {
      candles.push({open:p[0], high:p[1], low:p[2], close:p[3]});
    }
  }
  return candles;
}

// ---------- AUTO HISTORY & FUTURE ----------
function autoGenerateLeftCandles(price, direction) {
  const candles = [];
  for (let i = 12; i > 0; i--) {
    let trendBias = direction === "bullish" ? 0.5 : direction === "bearish" ? -0.5 : 0;
    let noise = (Math.random() - 0.5) * 0.6;
    let close = price - trendBias * i + noise;
    candles.unshift({
      open: close - 0.2,
      high: close + 0.4,
      low: close - 0.4,
      close
    });
  }
  return candles;
}

function simulateFuture(score, price, timeframe, direction) {
  const candles = [];
  let baseSlope = score >= 8 ? 1.0 : score >= 5 ? 0.5 : 0.15;
  if (direction === "bearish") baseSlope *= -1;
  if (direction === "neutral") baseSlope = 0;

  let tfScale = timeframe === "daily" ? 0.3 : timeframe === "4h" ? 0.5 : 1;

  for (let i = 0; i < 20; i++) {
    let noise = (Math.random() - 0.5) * 0.4;
    let close = price + baseSlope * (i / 4) * tfScale + noise;
    candles.push({
      open: close - 0.2,
      high: close + 0.5,
      low: close - 0.5,
      close
    });
  }
  return candles;
}

// ---------- ENTRY / STOP / R:R ----------
function computeEntryStop(price, ma20, ma50, swingLow, swingHigh, direction) {
  let entry, stop;
  if (direction === "bullish") {
    entry = (ma20 + ma50) / 2;
    stop = !isNaN(swingLow) ? swingLow * 0.99 : price * 0.97;
  } else if (direction === "bearish") {
    entry = (ma20 + ma50) / 2;
    stop = !isNaN(swingHigh) ? swingHigh * 1.01 : price * 1.03;
  } else {
    entry = price;
    stop = price;
  }
  entry = parseFloat(entry.toFixed(2));
  stop = parseFloat(stop.toFixed(2));

  let riskPerShare = Math.abs(entry - stop);
  let targetMove = riskPerShare * 2; // default 2R target
  let target = direction === "bullish" ? entry + targetMove : direction === "bearish" ? entry - targetMove : entry;
  target = parseFloat(target.toFixed(2));
  let rr = riskPerShare === 0 ? 0 : Math.abs(target - entry) / riskPerShare;

  return { entry, stop, target, rr: parseFloat(rr.toFixed(2)) };
}

// ---------- CHART ----------
function drawChart(left, future) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const all = left.concat(future);
  if (!all.length) return;

  let min = Math.min(...all.map(c => c.low));
  let max = Math.max(...all.map(c => c.high));
  if (max === min) { max += 1; min -= 1; }

  const pad = 20;
  const w = canvas.width;
  const h = canvas.height;
  const cw = (w - pad*2) / all.length;

  function y(v) { return h - pad - ((v - min) / (max - min)) * (h - pad*2); }

  ctx.fillStyle = "#0f0f16";
  ctx.fillRect(0,0,w,h);

  all.forEach((c,i)=>{
    const x = pad + i*cw + cw/2;
    ctx.strokeStyle = c.close >= c.open ? "#3cff9d" : "#ff4c84";
    ctx.fillStyle = ctx.strokeStyle;

    ctx.beginPath();
    ctx.moveTo(x, y(c.high));
    ctx.lineTo(x, y(c.low));
    ctx.stroke();

    const top = y(Math.max(c.open,c.close));
    const bot = y(Math.min(c.open,c.close));
    const bh = Math.max(2, bot-top);
    ctx.fillRect(x - cw*0.3, top, cw*0.6, bh);
  });
}

// ---------- MAIN ENGINE ----------
function runFormula() {
  const price = parseFloat(document.getElementById("price").value);
  const ma20 = parseFloat(document.getElementById("ma20").value);
  const ma50 = parseFloat(document.getElementById("ma50").value);
  const ma200 = parseFloat(document.getElementById("ma200").value);
  const pattern = document.getElementById("pattern").value;
  const timeframe = document.getElementById("timeframe").value;
  const support = parseFloat(document.getElementById("support").value);
  const resistance = parseFloat(document.getElementById("resistance").value);
  const swingLow = parseFloat(document.getElementById("swingLow").value);
  const swingHigh = parseFloat(document.getElementById("swingHigh").value);
  const even = document.getElementById("even").value;

  if ([price, ma20, ma50, ma200].some(v => isNaN(v))) {
    document.getElementById("output").innerHTML = "<p>Please fill price and all EMAs.</p>";
    return;
  }

  let bull = 0;
  let bear = 0;
  const tags = [];

  // Trend stack
  if (price > ma20 && ma20 > ma50 && ma50 > ma200) { bull += 4; tags.push('<span class="pill pill-bull">Bullish EMA stack</span>'); }
  if (price < ma20 && ma20 < ma50 && ma50 < ma200) { bear += 4; tags.push('<span class="pill pill-bear">Bearish EMA stack</span>'); }

  // Pattern
  if (pattern === "roundingBottom") { bull += 2; tags.push('<span class="pill pill-bull">Rounding bottom</span>'); }
  if (pattern === "roundingTop") { bear += 2; tags.push('<span class="pill pill-bear">Rounding top</span>'); }
  if (pattern === "doubleBottom") { bull += 2; tags.push('<span class="pill pill-bull">Double bottom</span>'); }
  if (pattern === "doubleTop") { bear += 2; tags.push('<span class="pill pill-bear">Double top</span>'); }
  if (pattern === "bullFlag") { bull += 2; tags.push('<span class="pill pill-bull">Bull flag</span>'); }
  if (pattern === "bearFlag") { bear += 2; tags.push('<span class="pill pill-bear">Bear flag</span>'); }

  // Even level
  if (even === "yes" && nearEven(price)) {
    if (price >= ma20) { bull += 1; tags.push('<span class="pill pill-bull">Even level support</span>'); }
    if (price <= ma20) { bear += 1; tags.push('<span class="pill pill-bear">Even level resistance</span>'); }
  }

  // Structure
  if (!isNaN(support) && price > support && price - support <= price * 0.01) {
    bull += 2; tags.push('<span class="pill pill-bull">Sitting on support</span>');
  }
  if (!isNaN(resistance) && price < resistance && resistance - price <= price * 0.01) {
    bear += 2; tags.push('<span class="pill pill-bear">Under resistance</span>');
  }

  // Final direction & score
  let direction = "neutral";
  if (bull > bear && bull >= 4) direction = "bullish";
  if (bear > bull && bear >= 4) direction = "bearish";

  let score = Math.max(bull, bear);
  if (score > 10) score = 10;

  // Entry / stop / target / R:R
  const es = computeEntryStop(price, ma20, ma50, swingLow, swingHigh, direction);

  // Candles
  const manualText = document.getElementById("manualCandles").value;
  let leftCandles = parseManualCandles(manualText);
  if (!leftCandles.length) leftCandles = autoGenerateLeftCandles(price, direction);
  const futureCandles = simulateFuture(score, price, timeframe, direction);
  drawChart(leftCandles, futureCandles);

  // Verdict text
  let verdict;
  if (direction === "bullish") {
    verdict = score >= 8 ? "🔥 Strong Bullish Setup (CALL bias)" :
              score >= 5 ? "⚠️ Moderate Bullish Setup" :
              "❌ Weak Bullish Edge";
  } else if (direction === "bearish") {
    verdict = score >= 8 ? "🔥 Strong Bearish Setup (PUT bias)" :
              score >= 5 ? "⚠️ Moderate Bearish Setup" :
              "❌ Weak Bearish Edge";
  } else {
    verdict = "❌ No Clear Direction – treat as chop.";
  }

  const cls = score >= 8 ? "strong" : score >= 5 ? "decent" : "weak";

  document.getElementById("output").innerHTML = `
    <div class="result ${cls}">
      <h2>Setup Summary</h2>
      <p><strong>Verdict:</strong> ${verdict}</p>
      <p><strong>Direction:</strong> ${direction}</p>
      <p><strong>Score (0–10):</strong> ${score}</p>
      <p><strong>Entry:</strong> ${es.entry}</p>
      <p><strong>Stop:</strong> ${es.stop}</p>
      <p><strong>Target (2R default):</strong> ${es.target}</p>
      <p><strong>Approx. R:R:</strong> ${es.rr}:1</p>
      <p><strong>Evidence:</strong> ${tags.length ? tags.join(" ") : '<span class="pill pill-neutral">No strong pattern evidence</span>'}</p>
      <p class="note">These values are exported to the options page to choose the contract that best matches this setup.</p>
    </div>
  `;

  // EXPORT TO OPTIONS PAGE
  localStorage.setItem("gf_direction", direction);
  localStorage.setItem("gf_score", score);
  localStorage.setItem("gf_entry", es.entry);
  localStorage.setItem("gf_stop", es.stop);
  localStorage.setItem("gf_target", es.target);
  localStorage.setItem("gf_rr", es.rr);
  localStorage.setItem("gf_timeframe", timeframe);
}

function goToOptions() {
  window.location.href = "options.html";
}
</script>

</body>
</html>
