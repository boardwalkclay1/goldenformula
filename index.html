<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Golden Formula – Setup Checker</title>
<style>
  body { font-family: Arial, sans-serif; background:#050509; color:#f5f5f5; padding:20px; max-width:1000px; margin:0 auto; }
  h2 { color:#ff2b6a; }
  h3 { color:#ff9ac0; margin-top:25px; }
  label { display:block; margin-top:8px; font-size:13px; }
  input, select, textarea { padding:7px; margin-top:3px; width:100%; border-radius:4px; border:1px solid #333; background:#15151b; color:#f5f5f5; }
  textarea { min-height:70px; font-family:monospace; }
  button { padding:10px; background:#ff2b6a; color:white; border:none; width:100%; margin-top:15px; border-radius:4px; font-weight:bold; cursor:pointer; }
  button:hover { background:#ff4c84; }
  .section-box { border:1px solid #333; border-radius:6px; padding:10px; margin-top:10px; background:#0b0b12; }
  .result { margin-top:20px; padding:15px; border-radius:8px; }
  .strong { background:#123822; border:1px solid #1f8b4c; }
  .decent { background:#3a3218; border:1px solid #8b6b1f; }
  .weak { background:#3a1823; border:1px solid #8b1f3a; }
  canvas { background:#0f0f16; border:1px solid #333; border-radius:6px; margin-top:15px; width:100%; max-width:950px; }
</style>
</head>
<body>

<h2>Golden Formula – Setup Checker</h2>

<div class="section-box">
  <h3>Inputs</h3>

  <label>Timeframe</label>
  <select id="timeframe">
    <option value="5m">5m</option>
    <option value="15m">15m</option>
    <option value="1h">1h</option>
    <option value="4h">4h</option>
    <option value="daily">daily</option>
  </select>

  <label>Current Price</label>
  <input id="price" type="number" step="0.01">

  <label>20 EMA</label>
  <input id="ma20" type="number" step="0.01">

  <label>50 EMA</label>
  <input id="ma50" type="number" step="0.01">

  <label>200 EMA</label>
  <input id="ma200" type="number" step="0.01">

  <label>Pattern</label>
  <select id="pattern">
    <option value="none">None</option>
    <option value="roundingBottom">Rounding Bottom</option>
    <option value="roundingTop">Rounding Top</option>
    <option value="doubleBottom">Double Bottom</option>
    <option value="doubleTop">Double Top</option>
    <option value="bullFlag">Bull Flag</option>
    <option value="bearFlag">Bear Flag</option>
  </select>

  <label>Support</label>
  <input id="support" type="number" step="0.01">

  <label>Resistance</label>
  <input id="resistance" type="number" step="0.01">

  <label>Swing Low</label>
  <input id="swingLow" type="number" step="0.01">

  <label>Swing High</label>
  <input id="swingHigh" type="number" step="0.01">
</div>

<button onclick="runFormula()">Run Golden Formula</button>

<div id="output"></div>
<canvas id="chart" width="950" height="320"></canvas>

<button onclick="goToOptions()">Go to Options Selector →</button>

<script>
function runFormula() {
  const price = parseFloat(document.getElementById("price").value);
  const ma20 = parseFloat(document.getElementById("ma20").value);
  const ma50 = parseFloat(document.getElementById("ma50").value);
  const ma200 = parseFloat(document.getElementById("ma200").value);
  const pattern = document.getElementById("pattern").value;
  const timeframe = document.getElementById("timeframe").value;
  const support = parseFloat(document.getElementById("support").value);
  const resistance = parseFloat(document.getElementById("resistance").value);
  const swingLow = parseFloat(document.getElementById("swingLow").value);
  const swingHigh = parseFloat(document.getElementById("swingHigh").value);

  let bull = 0;
  let bear = 0;

  if (price > ma20 && ma20 > ma50 && ma50 > ma200) bull += 3;
  if (price < ma20 && ma20 < ma50 && ma50 < ma200) bear += 3;

  if (pattern === "roundingBottom") bull += 2;
  if (pattern === "roundingTop") bear += 2;
  if (pattern === "doubleBottom") bull += 2;
  if (pattern === "doubleTop") bear += 2;
  if (pattern === "bullFlag") bull += 2;
  if (pattern === "bearFlag") bear += 2;

  if (!isNaN(support) && price > support) bull += 1;
  if (!isNaN(resistance) && price < resistance) bear += 1;

  let direction = "neutral";
  if (bull > bear && bull >= 3) direction = "bullish";
  if (bear > bull && bear >= 3) direction = "bearish";

  let score = Math.max(bull, bear);
  if (score > 10) score = 10;

  let entry, stop;
  if (direction === "bullish") {
    entry = (ma20 + ma50) / 2;
    stop = !isNaN(swingLow) ? swingLow * 0.99 : price * 0.97;
  } else if (direction === "bearish") {
    entry = (ma20 + ma50) / 2;
    stop = !isNaN(swingHigh) ? swingHigh * 1.01 : price * 1.03;
  } else {
    entry = price;
    stop = price;
  }

  entry = parseFloat(entry.toFixed(2));
  stop = parseFloat(stop.toFixed(2));

  document.getElementById("output").innerHTML = `
    <div class="result">
      <h3>Direction: ${direction}</h3>
      <p><strong>Score:</strong> ${score}</p>
      <p><strong>Entry:</strong> ${entry}</p>
      <p><strong>Stop:</strong> ${stop}</p>
    </div>
  `;

  // SAVE TO LOCAL STORAGE FOR OPTIONS PAGE
  localStorage.setItem("gf_direction", direction);
  localStorage.setItem("gf_score", score);
  localStorage.setItem("gf_entry", entry);
  localStorage.setItem("gf_stop", stop);
  localStorage.setItem("gf_timeframe", timeframe);
}

function goToOptions() {
  window.location.href = "options.html";
}
</script>

</body>
</html>
