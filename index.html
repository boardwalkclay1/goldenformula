<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Golden Formula – Home</title>
<script src="https://unpkg.com/tesseract.js@4.1.1/dist/tesseract.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; background:#050509; color:#f5f5f5; padding:20px; max-width:900px; margin:0 auto; }
  h1 { color:#ff2b6a; }
  h2 { color:#ff9ac0; margin-top:20px; }
  label { display:block; margin-top:8px; font-size:13px; }
  input, select, textarea { width:100%; padding:7px; margin-top:3px; border-radius:4px; border:1px solid #333; background:#15151b; color:#f5f5f5; }
  textarea { min-height:70px; font-family:monospace; }
  button { width:100%; padding:10px; margin-top:15px; border:none; border-radius:4px; background:#ff2b6a; color:#fff; font-weight:bold; cursor:pointer; }
  button:hover { background:#ff4c84; }
  .box { border:1px solid #333; border-radius:6px; padding:12px; margin-top:12px; background:#0b0b12; }
  .note { font-size:11px; color:#b0b0c0; margin-top:3px; }
  .result { margin-top:15px; padding:12px; border-radius:6px; background:#123822; border:1px solid #1f8b4c; }
  ul { margin-top:6px; }
</style>
</head>
<body>

<h1>Golden Formula – Home</h1>
<p class="note">
  Upload a screenshot, paste text, or type numbers. The page will read the data, apply simple rules, and save everything for the Options and Simulator pages.
</p>

<div class="box">
  <h2>1. Screenshot (auto‑read)</h2>
  <label>Upload chart or options screenshot</label>
  <input type="file" id="imageInput" accept="image/*">
  <p class="note" id="ocrStatus">No image loaded yet.</p>
</div>

<div class="box">
  <h2>2. Paste or type numbers</h2>

  <label>Paste data (optional)</label>
  <textarea id="pasteBox" placeholder="Example:
price: 13.69, high: 14.18, low: 13.37, ma20: 13.90, ma50: 13.64, ma200: 13.53"></textarea>

  <label>Current Price</label>
  <input id="price" type="number" step="0.01">

  <label>Day High</label>
  <input id="dayHigh" type="number" step="0.01">

  <label>Day Low</label>
  <input id="dayLow" type="number" step="0.01">

  <label>Fast Moving Average (20)</label>
  <input id="maFast" type="number" step="0.01">

  <label>Slow Moving Average (50)</label>
  <input id="maSlow" type="number" step="0.01">

  <label>Long Moving Average (200)</label>
  <input id="ma200" type="number" step="0.01">

  <label>Timeframe</label>
  <select id="timeframe">
    <option value="5m">5 minutes</option>
    <option value="15m">15 minutes</option>
    <option value="1h">1 hour</option>
    <option value="4h">4 hours</option>
    <option value="daily">Daily</option>
  </select>
</div>

<div class="box">
  <h2>3. Pattern and reversal</h2>

  <label>Pattern</label>
  <select id="pattern">
    <option value="none">Nothing clear</option>
    <option value="doubleBottom">Double Bottom</option>
    <option value="roundingBottom">Rounding Bottom</option>
    <option value="doubleTop">Double Top</option>
    <option value="roundingTop">Rounding Top</option>
  </select>

  <label>Strong reversal candle at turning point?</label>
  <select id="reversal">
    <option value="no">No</option>
    <option value="yes">Yes</option>
  </select>

  <label>Reaction at clean even number? (100, 105, 110, etc.)</label>
  <select id="evenReaction">
    <option value="no">No</option>
    <option value="yes">Yes</option>
  </select>
</div>

<button onclick="runFormula()">Find Setup</button>

<div id="output" class="result"></div>

<div class="box">
  <button onclick="downloadSnapshot()">Download Setup Snapshot</button>
  <button onclick="window.location.href='options.html'">Go to Options Page →</button>
  <button onclick="window.location.href='simulator.html'">Go to Simulator →</button>
</div>

<script>
function autoCorrectNumber(raw, hintMin, hintMax) {
  if (raw == null || isNaN(raw)) return null;
  let v = raw;
  if (v > 1000 && hintMax && hintMax < 100) v = v / 100; // 1330 -> 13.30 style
  if (hintMin != null && v < hintMin * 0.1) v = v * 0.1;
  if (hintMax != null && v > hintMax * 10) v = v * 0.1;
  return v;
}

function parseLooseText(text) {
  const out = {};
  const tokens = text.replace(/\n/g, ' ').split(/[\s,]+/);

  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i].toLowerCase();
    const next = parseFloat(tokens[i+1]);
    if (t.includes("ma20") || t === "ma20:") out.maFast = next;
    if (t.includes("ma50") || t === "ma50:") out.maSlow = next;
    if (t.includes("ma200") || t === "ma200:") out.ma200 = next;
    if (t === "h/l" || t === "h/l:") {
      const hi = parseFloat(tokens[i+1]);
      const lo = parseFloat(tokens[i+3]);
      if (!isNaN(hi)) out.dayHigh = hi;
      if (!isNaN(lo)) out.dayLow = lo;
    }
  }

  const nums = tokens.map(x => parseFloat(x)).filter(x => !isNaN(x));
  if (nums.length) {
    const sorted = [...nums].sort((a,b)=>a-b);
    const min = sorted[0], max = sorted[sorted.length-1];
    const mid = sorted[Math.floor(sorted.length/2)];
    out.price = mid;
    if (!out.dayHigh || !out.dayLow) {
      out.dayLow = min;
      out.dayHigh = max;
    }
  }
  return out;
}

function nearestEven(price) { return Math.round(price / 5) * 5; }
function nextEvenUp(price) { return Math.ceil(price / 5) * 5; }
function nextEvenDown(price) { return Math.floor(price / 5) * 5; }

function runFormula() {
  let text = document.getElementById("pasteBox").value || "";
  let parsed = text ? parseLooseText(text) : {};

  let price = autoCorrectNumber(parsed.price ?? parseFloat(document.getElementById("price").value), 1, 1000);
  let dayHigh = autoCorrectNumber(parsed.dayHigh ?? parseFloat(document.getElementById("dayHigh").value), 1, 1000);
  let dayLow = autoCorrectNumber(parsed.dayLow ?? parseFloat(document.getElementById("dayLow").value), 1, 1000);
  let maFast = autoCorrectNumber(parsed.maFast ?? parseFloat(document.getElementById("maFast").value), 1, 1000);
  let maSlow = autoCorrectNumber(parsed.maSlow ?? parseFloat(document.getElementById("maSlow").value), 1, 1000);
  let ma200 = autoCorrectNumber(parsed.ma200 ?? parseFloat(document.getElementById("ma200").value), 1, 1000);

  const timeframe = document.getElementById("timeframe").value;
  const pattern = document.getElementById("pattern").value;
  const reversal = document.getElementById("reversal").value;
  const evenReaction = document.getElementById("evenReaction").value;

  if ([price, maFast, maSlow].some(v => v == null || isNaN(v))) {
    document.getElementById("output").innerHTML = "<p>Please make sure price and both moving averages are readable.</p>";
    return;
  }

  let direction = "none";
  const reasons = [];

  if (maFast > maSlow && price > maFast) {
    direction = "call";
    reasons.push("Fast moving average is above slow and price is above both → up move.");
  } else if (maFast < maSlow && price < maFast) {
    direction = "put";
    reasons.push("Fast moving average is below slow and price is below both → down move.");
  } else {
    reasons.push("Moving averages do not clearly show up or down.");
  }

  if (maFast > maSlow && maFast > ma200) reasons.push("Fast is above slow and long → golden cross style uptrend.");
  if (maFast < maSlow && maFast < ma200) reasons.push("Fast is below slow and long → death cross style downtrend.");
  const diff = Math.abs(maFast - maSlow);
  if (diff <= price * 0.005) reasons.push("Fast and slow moving averages are very close → a cross may be coming.");

  let patternOk = false;
  if (direction === "call" && (pattern === "doubleBottom" || pattern === "roundingBottom")) {
    patternOk = true; reasons.push("You marked an obvious bottom pattern.");
  }
  if (direction === "put" && (pattern === "doubleTop" || pattern === "roundingTop")) {
    patternOk = true; reasons.push("You marked an obvious top pattern.");
  }
  if (!patternOk) reasons.push("Pattern does not clearly match the direction.");

  if (reversal === "yes") reasons.push("You saw a strong reversal candle at the turning point.");
  else reasons.push("No strong reversal candle confirmed.");

  if (evenReaction === "yes") {
    const level = nearestEven(price);
    reasons.push("Price reacted at a clean even number around " + level + ".");
  } else {
    reasons.push("No clear reaction at an even number.");
  }

  if (!isNaN(dayHigh) && !isNaN(dayLow)) {
    const range = dayHigh - dayLow;
    if (range > 0) {
      const pos = (price - dayLow) / range;
      if (pos < 0.2) reasons.push("Price is near the low of the day → could be a bottom area.");
      else if (pos > 0.8) reasons.push("Price is near the high of the day → could be a top area.");
    }
  }

  const valid = (direction !== "none" && patternOk && reversal === "yes" && evenReaction === "yes");

  let entry = "";
  let stop = "";

  if (valid) {
    if (direction === "call") {
      entry = nextEvenUp(price);
      stop = (entry * 0.8).toFixed(2);
      reasons.push("CALL idea. Enter at the next even number above: " + entry + ".");
      reasons.push("Stop loss is 20% below entry: " + stop + ".");
    } else {
      entry = nextEvenDown(price);
      stop = (entry * 1.2).toFixed(2);
      reasons.push("PUT idea. Enter at the next even number below: " + entry + ".");
      reasons.push("Stop loss is 20% above entry: " + stop + ".");
    }
  }

  if (!valid) {
    document.getElementById("output").innerHTML = `
      <h2>No Trade – Not Simple Enough</h2>
      <ul>${reasons.map(r => `<li>${r}</li>`).join("")}</ul>
    `;
    direction = "none"; entry = ""; stop = "";
  } else {
    document.getElementById("output").innerHTML = `
      <h2>Trade Idea Found</h2>
      <p><strong>Type:</strong> ${direction === "call" ? "CALL (bet on up)" : "PUT (bet on down)"}</p>
      <p><strong>Entry:</strong> ${entry}</p>
      <p><strong>Stop (20%):</strong> ${stop}</p>
      <ul>${reasons.map(r => `<li>${r}</li>`).join("")}</ul>
    `;
  }

  localStorage.setItem("gf_direction", direction);
  localStorage.setItem("gf_entry", entry);
  localStorage.setItem("gf_stop", stop);
  localStorage.setItem("gf_price", price || "");
  localStorage.setItem("gf_maFast", maFast || "");
  localStorage.setItem("gf_maSlow", maSlow || "");
  localStorage.setItem("gf_ma200", ma200 || "");
  localStorage.setItem("gf_dayHigh", dayHigh || "");
  localStorage.setItem("gf_dayLow", dayLow || "");
  localStorage.setItem("gf_timeframe", timeframe);
}

function downloadSnapshot() {
  const data = {
    direction: localStorage.getItem("gf_direction"),
    entry: localStorage.getItem("gf_entry"),
    stop: localStorage.getItem("gf_stop"),
    price: localStorage.getItem("gf_price"),
    maFast: localStorage.getItem("gf_maFast"),
    maSlow: localStorage.getItem("gf_maSlow"),
    ma200: localStorage.getItem("gf_ma200"),
    dayHigh: localStorage.getItem("gf_dayHigh"),
    dayLow: localStorage.getItem("gf_dayLow"),
    timeframe: localStorage.getItem("gf_timeframe")
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "golden_formula_snapshot.json";
  a.click();
  URL.revokeObjectURL(url);
}

document.getElementById("imageInput").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById("ocrStatus").textContent = "Reading image...";
  Tesseract.recognize(file, 'eng').then(({ data }) => {
    const text = data.text || "";
    document.getElementById("pasteBox").value = text;
    document.getElementById("ocrStatus").textContent = "Image read. Text pasted automatically. You can press 'Find Setup'.";
  }).catch(() => {
    document.getElementById("ocrStatus").textContent = "Could not read image. Try a clearer screenshot.";
  });
});
</script>

</body>
</html>
