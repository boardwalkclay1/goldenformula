<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Options – Simple Contract Picker</title>
<style>
  body { font-family: Arial, sans-serif; background:#050509; color:#f5f5f5; padding:20px; max-width:900px; margin:0 auto; }
  h1 { color:#ff2b6a; }
  h2 { color:#ff9ac0; margin-top:20px; }
  button { width:100%; padding:10px; margin-top:15px; border:none; border-radius:4px; background:#ff2b6a; color:#fff; font-weight:bold; cursor:pointer; }
  button:hover { background:#ff4c84; }
  .box { border:1px solid #333; border-radius:6px; padding:12px; margin-top:12px; background:#0b0b12; }
  .result { margin-top:15px; padding:12px; border-radius:6px; background:#123822; border:1px solid #1f8b4c; }
  .note { font-size:11px; color:#b0b0c0; margin-top:3px; }
  ul { margin-top:6px; }
</style>
</head>
<body>

<h1>Options – Simple Contract Picker</h1>
<p class="note">
  This page takes the setup from the Golden Formula page and turns it into a simple options idea.
</p>

<div id="formulaData" class="box"></div>

<button onclick="makeSuggestion()">Get Options Suggestion</button>

<div id="optionsOutput"></div>

<button onclick="window.location.href='index.html'">← Back to Setup Page</button>

<script>
function loadFormulaData() {
  const direction = localStorage.getItem("gf_direction") || "none";
  const entry = localStorage.getItem("gf_entry") || "";
  const stop = localStorage.getItem("gf_stop") || "";
  const timeframe = localStorage.getItem("gf_timeframe") || "unknown";

  document.getElementById("formulaData").innerHTML = `
    <h2>Setup From Previous Page</h2>
    <p><strong>Type:</strong> ${direction === "call" ? "CALL (bet on up)" : direction === "put" ? "PUT (bet on down)" : "No trade"}</p>
    <p><strong>Entry:</strong> ${entry || "—"}</p>
    <p><strong>Stop (20%):</strong> ${stop || "—"}</p>
    <p><strong>Timeframe:</strong> ${timeframe}</p>
    <p class="note">If this shows “No trade”, the first page did not find a clean setup.</p>
  `;
}

function makeSuggestion() {
  const direction = localStorage.getItem("gf_direction") || "none";
  const entry = parseFloat(localStorage.getItem("gf_entry") || "0");
  const timeframe = localStorage.getItem("gf_timeframe") || "unknown";

  if (direction === "none" || !entry) {
    document.getElementById("optionsOutput").innerHTML = `
      <div class="result">
        <h2>No Options Idea</h2>
        <p>The first page did not find a clear, simple setup. There is nothing to turn into an options trade.</p>
      </div>
    `;
    return;
  }

  // Simple expiration suggestion based on timeframe
  let expiration = "";
  if (timeframe === "5m" || timeframe === "15m") expiration = "0–2 days from now";
  else if (timeframe === "1h") expiration = "3–5 days from now";
  else if (timeframe === "4h") expiration = "1–2 weeks from now";
  else expiration = "2–4 weeks from now";

  const typeText = direction === "call" ? "CALL (you think price will go up)" : "PUT (you think price will go down)";

  document.getElementById("optionsOutput").innerHTML = `
    <div class="result">
      <h2>Simple Options Idea</h2>
      <p><strong>Contract Type:</strong> ${typeText}</p>
      <p><strong>Strike Price:</strong> Around ${entry.toFixed(2)} (the entry level from the first page).</p>
      <p><strong>Expiration:</strong> ${expiration}</p>
      <h3>Plain English Explanation</h3>
      <ul>
        <li>The first page found a very clear setup using moving averages, obvious bottoms/tops, and a strong bounce at an even number.</li>
        <li>We use that same level as the “strike” area for the options contract.</li>
        <li>We keep the stop loss idea simple on the chart (20% away), but here we just focus on the direction and level.</li>
        <li>If it was a CALL setup, you are betting price will move up from that even number. If it was a PUT setup, you are betting price will move down from that even number.</li>
      </ul>
      <p class="note">This is a teaching tool. It does not guarantee profit. It just turns a simple chart idea into a simple options idea.</p>
    </div>
  `;
}

loadFormulaData();
</script>

</body>
</html>
